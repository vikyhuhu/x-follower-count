<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号列表布局回归</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: white; color: #0f1419; font: 15px/1.4 system-ui,sans-serif; }
body.dark { background: #15202b; color: #f7f9f9; }
main { width: 100%; max-width: 600px; padding: 12px; }
.compact { width: 350px; max-width: 100%; }
.cell { display: flex; flex-direction: column; padding: 12px; border: 1px solid #cfd9de; margin-bottom: 12px; }
.account { display: flex; flex-direction: row; gap: 12px; align-items: flex-start; }
.avatar { width: 48px; height: 48px; background: #dce3e8; border-radius: 50%; flex-shrink: 0; }
.identity, .native-name, .native-handle { display: flex; flex-direction: column; min-width: 0; }
.identity { flex: 1; }
.native-name a, .native-handle a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.native-name a { font-weight: bold; }
.native-handle { color: #536471; }
a { color: inherit; text-decoration: none; }
button { font: inherit; min-width: 72px; padding: 6px 10px; border: 0; border-radius: 20px; color: white; background: #0f1419; flex: 0 0 auto; }
p { margin: 8px 0 0 60px; }
article [data-testid="User-Name"] { display: flex; gap: 4px; min-width: 0; }
</style>
<main>
<h1>合成账号列表</h1>
<button id="load">载入当前页面</button>
<section class="compact" aria-label="侧边推荐">
  <div class="cell" data-testid="UserCell" id="compact">
    <div class="account">
      <div class="avatar"></div>
      <div class="identity">
        <div class="native-name"><a href="/ListUser">List User ✓</a></div>
        <div class="native-handle"><a href="/ListUser">@ListUser</a></div>
      </div>
      <button>Follow</button>
    </div>
  </div>
</section>
<section aria-label="完整用户列表">
  <div class="cell" data-testid="UserCell" id="full">
    <div class="account">
      <div class="avatar"></div>
      <div class="identity">
        <div class="native-name"><a href="/ListUser">List User ✓</a></div>
        <div class="native-handle"><a href="/ListUser">@ListUser</a></div>
      </div>
      <button>Follow</button>
    </div>
    <p>简介中的 <a href="/OtherUser">@OtherUser</a> 不应成为本卡账号。</p>
  </div>
  <div class="cell" data-testid="UserCell" id="nested">
    <div class="account">
      <div class="avatar"></div>
      <div class="identity" data-testid="UserName">
        <div class="native-name"><a href="/ListUser">List User ✓</a></div>
        <div class="native-handle"><a href="/ListUser">@ListUser</a></div>
      </div>
      <button>Follow</button>
    </div>
  </div>
</section>
<article><div data-testid="User-Name" id="author"><div><a href="/ListUser">List User</a></div><a href="/ListUser">@ListUser</a><a href="/ListUser/status/1">· 2h</a></div></article>
</main>
<script>
document.querySelector('#load').onclick = () => fetch('/i/api/graphql/fixture/' + new URLSearchParams(location.search).get('operation')).then(r => r.json());
</script>
</html>
